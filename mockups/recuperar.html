<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma — Recuperar contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF7FD}
a{color:#6D3FD9}a:hover{color:#4C24A8}
input:focus,textarea:focus,select:focus{outline:2px solid #6D3FD9;outline-offset:1px}
summary{cursor:pointer}
</style>
</head>
<body>
<div style="font-family: Manrope, system-ui, sans-serif; color: #221A35; background: #FAF7FD; min-height: 100vh; display: flex; flex-wrap: wrap">
  <section style="flex: 1 1 420px; background: #1F1633; color: #F4EEFF; padding: clamp(28px, 5vw, 64px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="40" height="40" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 3 L33 30 H3 Z" fill="none" stroke="#F49AC1" stroke-width="2.2" stroke-linejoin="round"></path><path d="M18 3 L22 30" stroke="#B9A2FF" stroke-width="2.2"></path><path d="M10 17 H26" stroke="#8FB0FF" stroke-width="2.2" stroke-linecap="round"></path></svg>
      <span style="font-family: Fraunces, serif; font-size: 28px; font-weight: 600">Prisma</span>
    </div>
    <p style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.08; max-width: 460px">Recupera el acceso a tu espacio <em style="color: #F49AC1">en un minuto</em>.</p>
    <span style="font-size: 12px; color: #C9BEE0">Autoevaluación académica con IA</span>
  </section>
  <section style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: clamp(24px, 5vw, 64px); box-sizing: border-box">
    <div style="width: 100%; max-width: 440px; background: #FFFFFF; border: 1px solid #ECE6F5; border-radius: 28px; padding: 36px clamp(22px, 3vw, 40px); box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 500; font-size: 32px">Recupera tu contraseña</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A4260">Escribe tu correo y te enviaremos un enlace.</p>
      
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Correo de tu cuenta<input type="email" placeholder="nombre@universidad.edu.co" style="min-height: 48px; border: 1.5px solid #DCD3EE; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 15px"></label>
      <button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; border: 0; background: #6D3FD9; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Enviar enlace</button>
      <a href="login.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; font-weight: 700">Volver a iniciar sesión</a>
    </div>
  </section>
</div>
</body>
</html>
